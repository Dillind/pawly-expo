<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
body { margin: 0; background: #FBFAF8; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #8F5A03; } a:hover { color: #1C1815; }
</style>
</helmet>
<div style="width:390px;height:540px;background:#FBFAF8;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;position:relative">

<div style="display:flex;align-items:center;height:44px;padding:0 24px;flex:none">
<span style="font:700 22px/1.2 'Gabarito', -apple-system, system-ui, sans-serif;color:#1C1815">Home</span>
</div>

<div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:16px 24px 24px;box-sizing:border-box">

<div style="background:#FFFFFF;border-radius:24px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:16px">
<div style="width:64px;height:64px;border-radius:100px;background:#F1EFEC;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
<span style="font:700 20px/1.25 'Gabarito', -apple-system, system-ui, sans-serif;color:#1C1815;text-align:center">No pets to look after</span>
<span style="font:400 15px/1.45 'Inter', -apple-system, system-ui, sans-serif;color:#746A60;text-align:center;max-width:260px">Create a household to start logging feeds, or join one you have been invited to.</span>
</div>
<div style="align-self:stretch;display:flex;flex-direction:column;gap:8px">
<button style="all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;height:42px;border-radius:100px;background:#F0A81C;cursor:pointer">
<span style="font:600 17px/1 'Inter', -apple-system, system-ui, sans-serif;color:#2A1D06">Create a household</span>
</button>
<button style="all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;height:42px;border-radius:100px;background:#F1EFEC;cursor:pointer">
<span style="font:600 17px/1 'Inter', -apple-system, system-ui, sans-serif;color:#1C1815">Join with a code</span>
</button>
</div>
</div>

<div style="background:#FFFFFF;border-radius:24px;padding:20px 24px;display:flex;align-items:center;gap:16px">
<div style="width:40px;height:40px;border-radius:100px;background:#F1EFEC;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font:600 15px/1.3 'Inter', -apple-system, system-ui, sans-serif;color:#1C1815">You follow two households</span>
<span style="font:400 13px/1.4 'Inter', -apple-system, system-ui, sans-serif;color:#746A60">Their posts are on the Posts tab.</span>
</div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m9 18 6-6-6-6"/></svg>
</div>

</div>
</div>
</x-dc>
</body>
</html>
