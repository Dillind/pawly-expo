<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
body { margin: 0; background: #FBFAF8; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #8F5A03; } a:hover { color: #1C1815; }
</style>
</helmet>
<div style="width:390px;height:680px;background:#FBFAF8;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;position:relative">

<div style="display:flex;align-items:center;height:44px;padding:0 8px;flex:none">
<div style="display:flex;align-items:center;gap:2px;width:120px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m15 18-6-6 6-6"/></svg>
<span style="font:400 17px/1 'Inter', -apple-system, system-ui, sans-serif;color:#8F5A03">Followers</span>
</div>
<span style="flex:1;text-align:center;font:700 18px/1 -apple-system, 'SF Pro Text', system-ui, sans-serif;color:#1C1815">Follow link</span>
<div style="width:120px"></div>
</div>

<div style="flex:1;display:flex;flex-direction:column;gap:24px;padding:16px 24px 24px;box-sizing:border-box">

<div style="background:#FFFFFF;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center">

<span style="font:400 14px/1.45 'Inter', -apple-system, system-ui, sans-serif;color:#746A60;text-align:center">Have them scan this, or send the link</span>

<div style="background:#FFFFFF;border:1px solid rgba(58, 48, 38, 0.13);border-radius:24px;padding:16px;display:flex;align-items:center;justify-content:center">
<svg width="168" height="168" viewBox="0 0 24 24" fill="none" stroke="#C4BAB0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
</div>

<div style="align-self:stretch;display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;border-radius:100px;background:#F1EFEC">
<span style="flex:1;font:400 14px/1 'SF Mono', ui-monospace, monospace;color:#1C1815;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">crumpet.app/h/kathys-household</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
</div>

<button style="all:unset;box-sizing:border-box;align-self:stretch;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:100px;background:#F1EFEC;cursor:pointer">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1815" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
<span style="font:600 17px/1 'Inter', -apple-system, system-ui, sans-serif;color:#1C1815">Share link</span>
</button>

</div>

<div style="display:flex;flex-direction:column;gap:10px;padding:0 4px">
<div style="display:flex;align-items:flex-start;gap:10px">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none;margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
<span style="flex:1;font:400 14px/1.45 'Inter', -apple-system, system-ui, sans-serif;color:#746A60">Anyone with the link can ask to follow. You accept each request yourself, so the link gives nothing away on its own.</span>
</div>
<div style="display:flex;align-items:flex-start;gap:10px">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none;margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
<span style="flex:1;font:400 14px/1.45 'Inter', -apple-system, system-ui, sans-serif;color:#746A60">It does not expire. An invite code does, because it hands over a seat.</span>
</div>
</div>

</div>
</div>
</x-dc>
</body>
</html>
