<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
body { margin: 0; background: #FBFAF8; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #8F5A03; } a:hover { color: #1C1815; }
</style>
</helmet>
<div style="width:390px;height:400px;background:#FBFAF8;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;position:relative">

<div style="display:flex;align-items:center;height:44px;padding:0 8px;flex:none">
<div style="display:flex;align-items:center;gap:2px;width:110px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m15 18-6-6 6-6"/></svg>
<span style="font:400 17px/1 'Inter', -apple-system, system-ui, sans-serif;color:#8F5A03">Settings</span>
</div>
<span style="flex:1;text-align:center;font:700 18px/1 -apple-system, 'SF Pro Text', system-ui, sans-serif;color:#1C1815">Household</span>
<div style="width:110px"></div>
</div>

<div style="flex:1;display:flex;flex-direction:column;gap:24px;padding:16px 24px 24px;box-sizing:border-box">

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font:400 13px/1.3 'Inter', -apple-system, system-ui, sans-serif;color:#746A60;padding-left:4px">People</span>
<div style="background:#FFFFFF;border-radius:12px;padding:4px 0;display:flex;flex-direction:column;overflow:hidden">

<div style="display:flex;align-items:center;gap:16px;height:44px;padding:0 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
<span style="flex:1;font:400 16px/1.3 'Inter', -apple-system, system-ui, sans-serif;color:#1C1815">Members</span>
<span style="font:400 14px/1.3 'Inter', -apple-system, system-ui, sans-serif;color:#746A60">2</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m9 18 6-6-6-6"/></svg>
</div>

<div style="height:0.5px;background:#FBFAF8;margin-left:50px"></div>

<div style="display:flex;align-items:center;gap:16px;height:44px;padding:0 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
<span style="flex:1;font:400 16px/1.3 'Inter', -apple-system, system-ui, sans-serif;color:#1C1815">Followers</span>
<span style="height:20px;display:flex;align-items:center;padding:0 8px;border-radius:100px;background:#F0A81C;font:700 12px/1 'Inter', -apple-system, system-ui, sans-serif;color:#2A1D06">2 waiting</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m9 18 6-6-6-6"/></svg>
</div>

</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font:400 13px/1.3 'Inter', -apple-system, system-ui, sans-serif;color:#746A60;padding-left:4px">Alerts</span>
<div style="background:#FFFFFF;border-radius:12px;padding:4px 0;display:flex;flex-direction:column;overflow:hidden">
<div style="display:flex;align-items:center;gap:16px;height:44px;padding:0 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
<span style="flex:1;font:400 16px/1.3 'Inter', -apple-system, system-ui, sans-serif;color:#1C1815">Notifications</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m9 18 6-6-6-6"/></svg>
</div>
</div>
<span style="font:400 13px/1.4 'Inter', -apple-system, system-ui, sans-serif;color:#746A60;padding:0 4px">A follow request tells you here. Followers never get a notification of their own.</span>
</div>

</div>
</div>
</x-dc>
</body>
</html>
