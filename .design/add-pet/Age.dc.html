<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8F5A03; } a:hover { color: #E39A12; }
    .ab, .ab * { box-sizing: border-box; }
    .h1 { font-family: Gabarito, Inter, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
    .lbl { font-size: 14px; font-weight: 700; color: #1C1815; }
    .fld { height: 46px; border-radius: 8px; border: 1px solid #746A60; background: #FFFFFF; display: flex; align-items: center; padding: 0 12px; }
    .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #FFFFFF; }
    .segi { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #746A60; }
    .segon { background: #F1EFEC; font-weight: 700; color: #1C1815; }
    .card { background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(74,58,38,0.06), 0 6px 16px rgba(74,58,38,0.07); }
  </style>
</helmet>

<div class="ab" style="width: 390px; height: 700px; position: relative; overflow: hidden; background: #FBFAF8; font-family: Inter, -apple-system, system-ui, sans-serif; color: #1C1815;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 24px; margin-top: 62px;">
    <div style="font-size: 17px; color: #8F5A03; width: 60px;">Cancel</div>
    <div style="font-size: 17px; font-weight: 700;">Add a pet</div>
    <div style="width: 60px;"></div>
  </div>

  <div style="position: relative; height: 52px; margin-top: 12px;">
    <div style="position: absolute; left: 81px; top: 13px; width: 228px; height: 2px; border-radius: 2px; background: #E6DFD4;"></div>
    <div style="position: absolute; left: 0; top: 0; right: 0; display: flex; padding: 0 24px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #F0A81C; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px rgba(240,168,28,0.16);"><span style="font-size: 13px; font-weight: 700; color: #2A1D06;">1</span></div>
        <div style="font-size: 12px; font-weight: 700; color: #1C1815;">Pet details</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #FBFAF8; border: 1.5px solid rgba(58,48,38,0.20); display: flex; align-items: center; justify-content: center;"><span style="font-size: 13px; color: #9A9086;">2</span></div>
        <div style="font-size: 12px; color: #746A60;">Feed times</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #FBFAF8; border: 1.5px solid rgba(58,48,38,0.20); display: flex; align-items: center; justify-content: center;"><span style="font-size: 13px; color: #9A9086;">3</span></div>
        <div style="font-size: 12px; color: #746A60;">What they eat</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 24px 0 24px;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="h1" style="font-size: 30px; line-height: 1.06;">How old is Bailey?</div>
      <div style="font-size: 15px; line-height: 1.42; color: #746A60;">A rough age is fine. We work the birthday out from it, and you can correct it later.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="lbl">Age <span style="color: #CE3C39;">*</span></div>
      <div class="seg">
        <div class="segi">Date of birth</div>
        <div class="segi segon">Approximate age</div>
      </div>
    </div>

    <div class="card" style="padding: 12px 16px; position: relative;">
      <div style="position: absolute; left: 16px; right: 16px; top: 66px; height: 40px; border-radius: 10px; background: #F1EFEC;"></div>
      <div style="position: relative; display: flex;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
          <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">1</div>
          <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">2</div>
          <div style="height: 40px; display: flex; align-items: center; font-size: 22px; font-weight: 700; color: #1C1815;">3 <span style="font-size: 15px; font-weight: 400; color: #746A60; margin-left: 6px;">years</span></div>
          <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">4</div>
          <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">5</div>
        </div>
        <div style="width: 1px; background: rgba(58,48,38,0.10); margin: 8px 0;"></div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
          <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">4</div>
          <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">5</div>
          <div style="height: 40px; display: flex; align-items: center; font-size: 22px; font-weight: 700; color: #1C1815;">6 <span style="font-size: 15px; font-weight: 400; color: #746A60; margin-left: 6px;">months</span></div>
          <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">7</div>
          <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">8</div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      <span style="font-size: 13px; color: #9A9086;">Born around March 2023</span>
    </div>

    <div style="height: 42px; border-radius: 100px; background: #F0A81C; display: flex; align-items: center; justify-content: center; margin-top: 4px; box-shadow: 0 2px 6px rgba(200,140,20,0.28);">
      <span style="font-size: 17px; font-weight: 700; color: #2A1D06;">Continue</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
