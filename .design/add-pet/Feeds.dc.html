<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8F5A03; } a:hover { color: #E39A12; }
    .ab, .ab * { box-sizing: border-box; }
    .h1 { font-family: Gabarito, Inter, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
    .lbl { font-size: 14px; font-weight: 700; color: #1C1815; }
    .fld { height: 46px; border-radius: 8px; border: 1px solid #746A60; background: #FFFFFF; display: flex; align-items: center; padding: 0 12px; }
    .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #FFFFFF; }
    .segi { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #746A60; }
    .segon { background: #F1EFEC; font-weight: 700; color: #1C1815; }
    .card { background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(74,58,38,0.06), 0 6px 16px rgba(74,58,38,0.07); }
    .row { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 18px; }
    .rule { height: 1px; background: rgba(58,48,38,0.09); margin-left: 18px; }
  </style>
</helmet>

<div class="ab" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBFAF8; font-family: Inter, -apple-system, system-ui, sans-serif; color: #1C1815;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 24px; margin-top: 62px;">
    <div style="width: 60px; display: flex; align-items: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </div>
    <div style="font-size: 17px; font-weight: 700;">Add a pet</div>
    <div style="width: 60px;"></div>
  </div>

  <div style="position: relative; height: 52px; margin-top: 12px;">
    <div style="position: absolute; left: 81px; top: 13px; width: 228px; height: 2px; border-radius: 2px; background: #E6DFD4;"></div>
    <div style="position: absolute; left: 81px; top: 13px; width: 114px; height: 2px; border-radius: 2px; background: #F0A81C;"></div>
    <div style="position: absolute; left: 0; top: 0; right: 0; display: flex; padding: 0 24px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #FDECC8; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
        <div style="font-size: 12px; color: #746A60;">Pet details</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #F0A81C; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px rgba(240,168,28,0.16);"><span style="font-size: 13px; font-weight: 700; color: #2A1D06;">2</span></div>
        <div style="font-size: 12px; font-weight: 700; color: #1C1815;">Feed times</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #FBFAF8; border: 1.5px solid rgba(58,48,38,0.20); display: flex; align-items: center; justify-content: center;"><span style="font-size: 13px; color: #9A9086;">3</span></div>
        <div style="font-size: 12px; color: #746A60;">What they eat</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 24px 0 24px;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="h1" style="font-size: 30px; line-height: 1.06;">When does Bailey eat?</div>
      <div style="font-size: 15px; line-height: 1.42; color: #746A60;">Set the times you feed them. Change them whenever you like.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div class="card" style="padding: 16px 18px; display: flex; align-items: center; gap: 14px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(240,168,28,0.14); display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <div class="h1" style="font-size: 17px; line-height: 1.2;">Morning</div>
          <div style="font-size: 13px; color: #746A60;">7:00 am &nbsp;·&nbsp; Every day</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="m9 18 6-6-6-6"></path></svg>
      </div>

      <div class="card" style="padding: 16px 18px; display: flex; align-items: center; gap: 14px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(240,168,28,0.14); display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <div class="h1" style="font-size: 17px; line-height: 1.2;">Dinner</div>
          <div style="font-size: 13px; color: #746A60;">5:00 pm &nbsp;·&nbsp; Every day</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="m9 18 6-6-6-6"></path></svg>
      </div>

      <div style="height: 52px; border-radius: 14px; border: 1px dashed rgba(58,48,38,0.20); display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E655C" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <span style="font-size: 15px; font-weight: 600; color: #6E655C;">Add a feed</span>
      </div>
    </div>

    <div style="font-size: 13px; line-height: 1.4; color: #9A9086;">Days are set per feed — they can skip dinner on Sundays and still eat breakfast.</div>

    <div style="height: 42px; border-radius: 100px; background: #F0A81C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(200,140,20,0.28);">
      <span style="font-size: 17px; font-weight: 700; color: #2A1D06;">Continue</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
