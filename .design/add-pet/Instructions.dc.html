<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8F5A03; } a:hover { color: #E39A12; }
    .ab, .ab * { box-sizing: border-box; }
    .h1 { font-family: Gabarito, Inter, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
    .lbl { font-size: 14px; font-weight: 700; color: #1C1815; }
    .fld { height: 46px; border-radius: 8px; border: 1px solid #746A60; background: #FFFFFF; display: flex; align-items: center; padding: 0 12px; }
    .card { background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(74,58,38,0.06), 0 6px 16px rgba(74,58,38,0.07); }
    .day { width: 40px; height: 40px; border-radius: 100px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
    .dayon { background: #F0A81C; color: #2A1D06; }
    .dayoff { background: #FFFFFF; border: 1px solid rgba(58,48,38,0.13); color: #746A60; }
  </style>
</helmet>

<div class="ab" style="width: 390px; height: 880px; position: relative; overflow: hidden; background: #FBFAF8; font-family: Inter, -apple-system, system-ui, sans-serif; color: #1C1815;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 24px; margin-top: 62px;">
    <div style="width: 60px; display: flex; align-items: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </div>
    <div style="font-size: 17px; font-weight: 700;">Add a pet</div>
    <div style="width: 60px;"></div>
  </div>

  <div style="position: relative; height: 52px; margin-top: 12px;">
    <div style="position: absolute; left: 81px; top: 13px; width: 228px; height: 2px; border-radius: 2px; background: #E6DFD4;"></div>
    <div style="position: absolute; left: 81px; top: 13px; width: 228px; height: 2px; border-radius: 2px; background: #F0A81C;"></div>
    <div style="position: absolute; left: 0; top: 0; right: 0; display: flex; padding: 0 24px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #FDECC8; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
        <div style="font-size: 12px; color: #746A60;">Pet details</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #FDECC8; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
        <div style="font-size: 12px; color: #746A60;">Feed times</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 100px; background: #F0A81C; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px rgba(240,168,28,0.16);"><span style="font-size: 13px; font-weight: 700; color: #2A1D06;">3</span></div>
        <div style="font-size: 12px; font-weight: 700; color: #1C1815;">What they eat</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 24px 0 24px;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="h1" style="font-size: 30px; line-height: 1.06;">What does Bailey get?</div>
      <div style="font-size: 15px; line-height: 1.42; color: #746A60;">Whoever feeds them sees this when they log it. A sitter will thank you.</div>
    </div>

    <div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span class="h1" style="font-size: 17px;">Morning</span>
        <span style="font-size: 14px; color: #746A60;">7:00 am</span>
      </div>
      <div style="min-height: 84px; border-radius: 8px; border: 1px solid #746A60; background: #FFFFFF; padding: 12px;">
        <span style="font-size: 16px;">Half a tin of wet food, one cup of dry</span>
      </div>
    </div>

    <div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span class="h1" style="font-size: 17px;">Dinner</span>
        <span style="font-size: 14px; color: #746A60;">5:00 pm</span>
      </div>
      <div style="min-height: 84px; border-radius: 8px; border: 1px solid #746A60; background: #FFFFFF; padding: 12px;">
        <span style="font-size: 16px; color: #9A9086;">One scoop of dry, no toppers</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;">
      <div style="height: 42px; border-radius: 100px; background: #F0A81C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(200,140,20,0.28);">
        <span style="font-size: 17px; font-weight: 700; color: #2A1D06;">Add Bailey</span>
      </div>
      <div style="height: 42px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 17px; font-weight: 700; color: #8F5A03;">Add without instructions</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
