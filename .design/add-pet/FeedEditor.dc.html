<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8F5A03; } a:hover { color: #E39A12; }
    .ab, .ab * { box-sizing: border-box; }
    .h1 { font-family: Gabarito, Inter, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
    .lbl { font-size: 14px; font-weight: 700; color: #1C1815; }
    .fld { height: 46px; border-radius: 8px; border: 1px solid #746A60; background: #FFFFFF; display: flex; align-items: center; padding: 0 12px; }
    .card { background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(74,58,38,0.06), 0 6px 16px rgba(74,58,38,0.07); }
    .day { width: 40px; height: 40px; border-radius: 100px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
    .dayon { background: #F0A81C; color: #2A1D06; }
    .dayoff { background: #FFFFFF; border: 1px solid rgba(58,48,38,0.13); color: #746A60; }
  </style>
</helmet>

<div class="ab" style="width: 390px; height: 880px; position: relative; overflow: hidden; background: #FBFAF8; font-family: Inter, -apple-system, system-ui, sans-serif; color: #1C1815;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 24px; margin-top: 62px;">
    <div style="width: 60px; display: flex; align-items: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8F5A03" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </div>
    <div style="font-size: 17px; font-weight: 700;">Feed</div>
    <div style="width: 60px;"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 24px 0 24px;">

    <div class="h1" style="font-size: 30px; line-height: 1.06;">Morning</div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="lbl">What to call it <span style="color: #CE3C39;">*</span></div>
      <div class="fld" style="justify-content: space-between;">
        <span style="font-size: 16px;">Morning</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#746A60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="lbl">Time <span style="color: #CE3C39;">*</span></div>
      <div class="card" style="padding: 12px 16px; position: relative;">
        <div style="position: absolute; left: 16px; right: 16px; top: 66px; height: 40px; border-radius: 10px; background: #F1EFEC;"></div>
        <div style="position: relative; display: flex;">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">5</div>
            <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">6</div>
            <div style="height: 40px; display: flex; align-items: center; font-size: 22px; font-weight: 700;">7</div>
            <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">8</div>
            <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">9</div>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">50</div>
            <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">55</div>
            <div style="height: 40px; display: flex; align-items: center; font-size: 22px; font-weight: 700;">00</div>
            <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">05</div>
            <div style="height: 34px; display: flex; align-items: center; font-size: 17px; color: #C4BCB2;">10</div>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div style="height: 34px;"></div>
            <div style="height: 32px;"></div>
            <div style="height: 40px; display: flex; align-items: center; font-size: 22px; font-weight: 700;">am</div>
            <div style="height: 32px; display: flex; align-items: center; font-size: 19px; color: #9A9086;">pm</div>
            <div style="height: 34px;"></div>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="lbl">Days</div>
      <div style="display: flex; justify-content: space-between;">
        <div class="day dayon">M</div>
        <div class="day dayon">T</div>
        <div class="day dayon">W</div>
        <div class="day dayon">T</div>
        <div class="day dayon">F</div>
        <div class="day dayon">S</div>
        <div class="day dayon">S</div>
      </div>
      <div style="font-size: 13px; color: #9A9086;">Every day</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="lbl">Instructions</div>
      <div style="min-height: 96px; border-radius: 8px; border: 1px solid #746A60; background: #FFFFFF; padding: 12px;">
        <span style="font-size: 16px; color: #9A9086;">Half a tin of wet food + 1 cup dry</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 4px;">
      <div style="height: 42px; border-radius: 100px; background: #F0A81C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(200,140,20,0.28);">
        <span style="font-size: 17px; font-weight: 700; color: #2A1D06;">Save</span>
      </div>
      <div style="height: 42px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 17px; font-weight: 700; color: #CE3C39;">Remove this feed</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
