<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #9E6404; } a:hover { color: #E39A12; }
    .ab, .ab * { box-sizing: border-box; }
    .photoWarm {
      background-image:
        radial-gradient(58% 42% at 76% 20%, rgba(255,233,182,0.98) 0%, rgba(255,190,105,0.70) 32%, rgba(190,130,60,0) 64%),
        radial-gradient(85% 55% at 20% 94%, rgba(98,126,58,0.95) 0%, rgba(58,80,38,0.92) 46%, rgba(40,56,28,0) 84%),
        linear-gradient(180deg, #8FB6D6 0%, #D8BE8C 42%, #6E8A4A 72%, #33481F 100%);
    }
    .photoCool {
      background-image:
        radial-gradient(60% 40% at 30% 20%, rgba(226,236,244,0.55) 0%, rgba(160,180,196,0) 65%),
        linear-gradient(180deg, #2A3138 0%, #4E5A63 55%, #939CA3 100%);
    }
  </style>
</helmet>

<div class="ab" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF6EF; font-family: Inter, -apple-system, system-ui, sans-serif; color: #1C1815;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 62px 24px 14px 24px; gap: 12px;">
    <div style="font-family: Gabarito, Inter, sans-serif; font-size: 30px; font-weight: 700; line-height: 1.0; letter-spacing: -0.7px;">Posts</div>
    <div style="width: 38px; height: 38px; border-radius: 100px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 2px 8px rgba(200,140,20,0.32);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A1D06" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </div>
  </div>

  <div style="background: #FFFFFF; padding: 12px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; border-radius: 100px; background: #EDE5D8; display: flex; align-items: center; justify-content: center; flex: none; font-size: 14px; font-weight: 700; color: #6E655C;">D</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <div style="font-size: 15px; font-weight: 600;">Dylan</div>
          <div style="font-size: 12px; color: #9A9086;">2 hours ago</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#9A9086" style="flex: none;"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-family: Gabarito, Inter, sans-serif; font-size: 21px; font-weight: 700; line-height: 1.15; letter-spacing: -0.3px;">Beach day</div>
        <div style="font-size: 15px; line-height: 1.42; color: #5B534B;">Biscuit found a very large stick and would not give it up. Sandy ears the whole way home.</div>
      </div>

      <div style="display: flex; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 7px; padding: 4px 12px 4px 4px; border-radius: 100px; background: #F3EDE2;">
          <div style="width: 20px; height: 20px; border-radius: 100px; background: radial-gradient(circle at 38% 32%, #EFD3A4 0%, #CFA063 46%, #8C6535 100%);"></div>
          <span style="font-size: 13px; font-weight: 600; color: #5B534B;">Biscuit</span>
        </div>
      </div>
    </div>

    <div class="photoWarm" style="position: relative; width: 390px; height: 300px; overflow: hidden;">
      <div style="position: absolute; left: 44%; bottom: 8%; width: 132px; height: 92px; border-radius: 50% 50% 44% 44%; background: rgba(46,30,14,0.62); filter: blur(1.5px);"></div>
      <div style="position: absolute; left: 56%; bottom: 24%; width: 46px; height: 44px; border-radius: 50%; background: rgba(46,30,14,0.66); filter: blur(1.5px);"></div>
      <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; display: flex; gap: 5px;">
        <div style="width: 6px; height: 6px; border-radius: 100px; background: rgba(255,255,255,0.98);"></div>
        <div style="width: 6px; height: 6px; border-radius: 100px; background: rgba(255,255,255,0.45);"></div>
        <div style="width: 6px; height: 6px; border-radius: 100px; background: rgba(255,255,255,0.45);"></div>
      </div>
    </div>

    <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; align-items: center; gap: 20px;">
        <div style="display: flex; align-items: center; gap: 7px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#E0405E" stroke="#E0405E" stroke-width="1.6"><path d="M12 20.5 4.2 13a4.8 4.8 0 0 1 6.8-6.8l1 1 1-1a4.8 4.8 0 0 1 6.8 6.8Z"></path></svg>
          <span style="font-size: 14px; font-weight: 600;">3</span>
        </div>
        <div style="display: flex; align-items: center; gap: 7px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A8078" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5Z"></path></svg>
          <span style="font-size: 14px; color: #8A8078;">2</span>
        </div>
      </div>
      <div style="font-size: 13px; color: #8A8078;">Liked by Nina and 2 others</div>
    </div>
  </div>

  <div style="height: 12px;"></div>

  <div style="background: #FFFFFF; padding: 12px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; border-radius: 100px; background: #EDE5D8; display: flex; align-items: center; justify-content: center; flex: none; font-size: 14px; font-weight: 700; color: #6E655C;">N</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 600;">Nina</div>
          <div style="font-size: 12px; color: #9A9086;">Yesterday</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#9A9086" style="flex: none;"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-family: Gabarito, Inter, sans-serif; font-size: 21px; font-weight: 700; line-height: 1.15; letter-spacing: -0.3px;">Bath night</div>
        <div style="font-size: 15px; line-height: 1.42; color: #5B534B;">Not impressed, but clean.</div>
      </div>
    </div>
    <div class="photoCool" style="width: 390px; height: 300px;"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(250,246,239,0.90); border-top: 1px solid rgba(58,48,38,0.10); backdrop-filter: blur(20px); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; padding-top: 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#9A9086"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10Z"></path></svg>
      <span style="font-size: 10px; color: #9A9086;">Home</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"></rect><path d="M21 8v9a2 2 0 0 1-2 2H7"></path><circle cx="8" cy="10" r="1.4"></circle><path d="m4 16 3.5-3.5L11 16"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: #9E6404;">Posts</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#9A9086"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0Z"></path></svg>
      <span style="font-size: 10px; color: #9A9086;">Profile</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F0A81C","options":["#F0A81C","#F5AC1B","#E39A12","#FFB933"],"section":"Palette"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F0A81C' };
  }
}
</script>
</body>
</html>
