name: check

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first. A stale run tells you
# nothing and holds a runner.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per check, so a red build names every failure at once. `bun run
  # check` chains them with && and stops at the first, which is right on a
  # laptop and wrong here — you would fix a type error, push, and only then
  # learn about the spelling one.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            run: bun run typecheck
          - name: lint
            run: bun run lint
          - name: format
            run: bun run format:check
          - name: spellcheck
            run: bun run spellcheck
          - name: test
            run: bun run test

    steps:
      - uses: actions/checkout@v4

      # Node is needed as well as bun. cspell runs on Node and its engines floor
      # is 22.18.0 — below that the spelling gate does not fail, it cannot run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install
        run: bun install --frozen-lockfile

      # expo-env.d.ts and .expo/types are generated, deliberately gitignored,
      # and required to typecheck — without them tsc cannot resolve the
      # side-effect import of '@/global.css'. The dev server writes them
      # normally; this is the documented way to get them on CI without starting
      # it. See https://docs.expo.dev/router/reference/typed-routes/
      #
      # The env vars are placeholders, not secrets. `bunx expo customize`
      # evaluates app.config.ts, and the Google Sign-In config plugin refuses to
      # load without an iosUrlScheme. Nothing here reaches a build or a bundle —
      # this step writes two type declaration files and exits, and the values are
      # never read. .env is gitignored and never reaches CI, which is why the
      # real ones are absent. A real build gets them from the EAS environment.
      - name: Generate Expo types
        env:
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.ci-placeholder
        run: bunx expo customize tsconfig.json

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
